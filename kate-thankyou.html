<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank you, Kate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --rose-bg:      #FDF0F4;
      --rose-page:    #FAE8EF;
      --rose-light:   #FBEAF0;
      --rose-border:  #F4C0D1;
      --rose-mid:     #ED93B1;
      --rose-deep:    #D4537E;
      --rose-dark:    #7B2D42;
      --rose-darker:  #5C1F30;
    }

    html, body {
      height: 100%;
      min-height: 100vh;
    }

    body {
      background: var(--rose-page);
      background-image:
        radial-gradient(circle at 12% 18%, rgba(212,83,126,0.07) 0%, transparent 52%),
        radial-gradient(circle at 88% 82%, rgba(212,83,126,0.05) 0%, transparent 46%),
        radial-gradient(circle at 50% 50%, rgba(253,240,244,0.4) 0%, transparent 70%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Lato', sans-serif;
      padding: 2.5rem 1.5rem;
    }

    /* ─── Card ─── */
    .card {
      background: var(--rose-bg);
      border: 1.5px solid var(--rose-deep);
      border-radius: 14px;
      padding: 3.5rem 3.5rem 3rem;
      outline: 6px solid var(--rose-bg);
      box-shadow:
        0 0 0 8px var(--rose-border),
        0 0 0 9px var(--rose-bg),
        0 16px 56px rgba(123,45,66,0.11);
      max-width: 820px;
      width: 100%;
      text-align: center;
    }

    /* ─── Ornament ─── */
    .ornament-top {
      display: flex; align-items: center; justify-content: center;
      gap: 12px; margin-bottom: 2.2rem;
      opacity: 0;
      animation: fadeUp 0.9s ease 0.2s forwards;
    }
    .ornament-line {
      flex: 1; max-width: 120px; height: 1px;
      background: linear-gradient(to right, transparent, var(--rose-border), transparent);
    }

    /* ─── Title ─── */
    .thank-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(28px, 4vw, 52px);
      font-weight: 400;
      font-style: italic;
      color: var(--rose-dark);
      letter-spacing: 0.04em;
      opacity: 0;
      transform: translateY(14px);
      animation: fadeUp 1.1s ease 0.7s forwards;
      margin-bottom: 2.8rem;
    }

    /* ─── Divider ─── */
    .ornament-divider {
      display: flex; align-items: center; justify-content: center;
      gap: 6px; margin-bottom: 2.4rem;
      opacity: 0;
      animation: fadeUp 0.9s ease 1.5s forwards;
    }
    .divider-line    { width: 60px; height: 1px; background: var(--rose-border); }
    .divider-dot     { width: 4px; height: 4px; border-radius: 50%; background: var(--rose-deep); }
    .divider-diamond { width: 6px; height: 6px; border: 1px solid var(--rose-deep); transform: rotate(45deg); }

    /* ─── Download button ─── */
    .download-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      background: var(--rose-deep);
      color: #FFF0F4;
      padding: 0.78rem 2.6rem;
      border-radius: 40px;
      text-decoration: none;
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(15px, 1.4vw, 19px);
      font-weight: 400;
      font-style: italic;
      letter-spacing: 0.1em;
      transition: background 0.22s ease, transform 0.18s ease, box-shadow 0.22s ease;
      box-shadow: 0 4px 18px rgba(212,83,126,0.28);
      opacity: 0;
      animation: fadeUp 1s ease 2.1s forwards;
    }
    .download-btn:hover {
      background: var(--rose-darker);
      transform: translateY(-3px);
      box-shadow: 0 8px 26px rgba(123,45,66,0.32);
    }
    .download-btn:active { transform: translateY(-1px); }

    .download-btn svg {
      width: 17px; height: 17px;
      stroke: #FFF0F4;
      flex-shrink: 0;
    }

    /* ─── Animation ─── */
    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }

    /* ─── Responsive ─── */
    @media (max-width: 580px) {
      .card { padding: 2rem 1.4rem 2.2rem; }
    }
  </style>
</head>
<body>

<div class="card">

  <div class="ornament-top">
    <div class="ornament-line"></div>
    <svg width="22" height="30" viewBox="0 0 22 30" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M11 2C9 5.5 5.5 6.5 5.5 10.5c0 3.1 2.5 5.5 5.5 5.5s5.5-2.4 5.5-5.5c0-4-3.5-5-5.5-8.5z" fill="#F4C0D1" stroke="#D4537E" stroke-width="0.8"/>
      <line x1="11" y1="16" x2="11" y2="29" stroke="#D4537E" stroke-width="0.8"/>
      <path d="M11 22 C9 20 6.5 20.5 6.5 20.5" stroke="#D4537E" stroke-width="0.8" stroke-linecap="round"/>
      <path d="M11 25 C13 23 15.5 23.5 15.5 23.5" stroke="#D4537E" stroke-width="0.8" stroke-linecap="round"/>
    </svg>
    <svg width="60" height="16" viewBox="0 0 60 16" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <line x1="0" y1="8" x2="22" y2="8" stroke="#F4C0D1" stroke-width="0.8"/>
      <circle cx="30" cy="8" r="4" fill="none" stroke="#D4537E" stroke-width="0.8"/>
      <circle cx="30" cy="8" r="1.5" fill="#D4537E"/>
      <line x1="38" y1="8" x2="60" y2="8" stroke="#F4C0D1" stroke-width="0.8"/>
    </svg>
    <svg width="22" height="30" viewBox="0 0 22 30" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="transform:scaleX(-1)">
      <path d="M11 2C9 5.5 5.5 6.5 5.5 10.5c0 3.1 2.5 5.5 5.5 5.5s5.5-2.4 5.5-5.5c0-4-3.5-5-5.5-8.5z" fill="#F4C0D1" stroke="#D4537E" stroke-width="0.8"/>
      <line x1="11" y1="16" x2="11" y2="29" stroke="#D4537E" stroke-width="0.8"/>
      <path d="M11 22 C9 20 6.5 20.5 6.5 20.5" stroke="#D4537E" stroke-width="0.8" stroke-linecap="round"/>
      <path d="M11 25 C13 23 15.5 23.5 15.5 23.5" stroke="#D4537E" stroke-width="0.8" stroke-linecap="round"/>
    </svg>
    <div class="ornament-line"></div>
  </div>

  <h1 class="thank-title">Thank you, Kate.</h1>

  <div class="ornament-divider">
    <div class="divider-line"></div>
    <div class="divider-dot"></div>
    <div class="divider-diamond"></div>
    <div class="divider-dot"></div>
    <div class="divider-line"></div>
  </div>

  <a class="download-btn" href="when-dee-met-kate.pdf" download="when-dee-met-kate.pdf">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 3v13M7 11l5 5 5-5"/><path d="M5 20h14"/>
    </svg>
    Download the comic
  </a>

</div>

</body>
</html>
