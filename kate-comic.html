<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>When Dee met Kate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --rose-bg:      #FDF0F4;
      --rose-page:    #FAE8EF;
      --rose-light:   #FBEAF0;
      --rose-border:  #F4C0D1;
      --rose-mid:     #ED93B1;
      --rose-deep:    #D4537E;
      --rose-dark:    #7B2D42;
      --rose-darker:  #5C1F30;
      --overlay-bg:   rgba(92, 31, 48, 0.88);
    }

    html, body { height: 100%; }

    body {
      min-height: 100vh;
      background: var(--rose-page);
      background-image:
        radial-gradient(circle at 15% 20%, rgba(212,83,126,0.06) 0%, transparent 50%),
        radial-gradient(circle at 85% 80%, rgba(212,83,126,0.05) 0%, transparent 45%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Lato', sans-serif;
      padding: 1.5rem;
    }

    .page-wrapper { width: 100%; max-width: 1060px; }

    /* ─── Ornamental frame ─── */
    .cal-frame {
      background: var(--rose-bg);
      border: 1.5px solid var(--rose-deep);
      border-radius: 14px;
      padding: 2.25rem 2.5rem 2.5rem;
      outline: 6px solid var(--rose-bg);
      box-shadow:
        0 0 0 8px var(--rose-border),
        0 0 0 9px var(--rose-bg),
        0 12px 48px rgba(123,45,66,0.10);
    }

    /* ─── Header ─── */
    .cal-header { text-align: center; margin-bottom: 2rem; }

    .ornament-top {
      display: flex; align-items: center; justify-content: center;
      gap: 12px; margin-bottom: 0.6rem;
    }
    .ornament-line {
      flex: 1; max-width: 160px; height: 1px;
      background: linear-gradient(to right, transparent, var(--rose-border), transparent);
    }

    .cal-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(22px, 3.5vw, 34px);
      font-weight: 400; font-style: italic;
      color: var(--rose-dark);
      letter-spacing: 0.04em;
      margin: 0.4rem 0 0.3rem;
    }
    .cal-subtitle {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(13px, 1.8vw, 16px);
      font-weight: 300; font-style: italic;
      color: var(--rose-deep);
      letter-spacing: 0.08em;
      margin-bottom: 0.7rem;
    }

    .ornament-divider {
      display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 0.2rem;
    }
    .divider-line     { width: 80px; height: 1px; background: var(--rose-border); }
    .divider-dot      { width: 4px; height: 4px; border-radius: 50%; background: var(--rose-deep); }
    .divider-diamond  { width: 6px; height: 6px; border: 1px solid var(--rose-deep); transform: rotate(45deg); }

    /* ─── Thumbnail grid ─── */
    .comic-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }

    .comic-thumb {
      position: relative;
      border-radius: 10px;
      overflow: hidden;
      border: 1.5px solid var(--rose-border);
      cursor: pointer;
      background: var(--rose-light);
      box-shadow: 0 4px 16px rgba(123,45,66,0.08);
      transition: transform 0.22s ease, box-shadow 0.22s ease, border-color 0.22s ease;
      animation: thumbFadeIn 0.5s ease both;
    }
    .comic-thumb:nth-child(1) { animation-delay: 0ms; }
    .comic-thumb:nth-child(2) { animation-delay: 80ms; }
    .comic-thumb:nth-child(3) { animation-delay: 160ms; }
    .comic-thumb:nth-child(4) { animation-delay: 240ms; }

    @keyframes thumbFadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .comic-thumb:hover {
      transform: translateY(-5px) scale(1.02);
      box-shadow: 0 12px 32px rgba(123,45,66,0.22);
      border-color: var(--rose-mid);
    }
    .comic-thumb:active { transform: translateY(-2px) scale(1.01); }

    .comic-thumb img {
      width: 100%;
      display: block;
      object-fit: cover;
    }

    /* Page label at bottom of each thumb */
    .thumb-label {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      background: linear-gradient(to top, rgba(92,31,48,0.72) 0%, transparent 100%);
      padding: 1.4rem 0.75rem 0.55rem;
      font-family: 'Cormorant Garamond', serif;
      font-size: 13px;
      font-weight: 400;
      font-style: italic;
      color: rgba(255,240,244,0.92);
      letter-spacing: 0.06em;
      text-align: center;
      pointer-events: none;
    }

    /* Hover magnifier icon */
    .thumb-icon {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%) scale(0.7);
      opacity: 0;
      width: 44px; height: 44px;
      background: rgba(253,240,244,0.88);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      transition: opacity 0.2s ease, transform 0.2s ease;
      pointer-events: none;
    }
    .thumb-icon svg { width: 20px; height: 20px; }
    .comic-thumb:hover .thumb-icon {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    /* ─── Modal overlay ─── */
    .modal {
      position: fixed; inset: 0;
      background: var(--overlay-bg);
      backdrop-filter: blur(8px);
      z-index: 300;
      opacity: 0; pointer-events: none;
      transition: opacity 0.3s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .modal.visible { opacity: 1; pointer-events: all; }

    /* Top bar inside modal */
    .modal-bar {
      position: fixed; top: 0; left: 0; right: 0;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.85rem 1.25rem;
      z-index: 10;
    }
    .modal-page-label {
      font-family: 'Cormorant Garamond', serif;
      font-size: 15px; font-weight: 300; font-style: italic;
      color: rgba(253,240,244,0.80);
      letter-spacing: 0.1em;
    }
    .modal-close {
      width: 38px; height: 38px;
      background: rgba(253,240,244,0.12);
      border: 1px solid rgba(244,192,209,0.35);
      color: rgba(253,240,244,0.88);
      border-radius: 50%;
      font-size: 15px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s, transform 0.15s;
      font-family: 'Lato', sans-serif;
    }
    .modal-close:hover { background: rgba(253,240,244,0.22); transform: scale(1.08); }

    /* Image area */
    .modal-stage {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
      padding: 3.5rem 5rem;
      overflow: hidden; /* default: no scroll */
    }
    .modal-stage.zoomed {
      overflow: auto;         /* scroll when zoomed */
      align-items: flex-start;
      justify-content: flex-start;
      cursor: zoom-out;
      padding: 3.5rem 5rem 5rem; /* extra bottom for scrollbar clearance */
    }

    .modal-img-wrap {
      position: relative;
      height: 100%;
      max-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .modal-stage.zoomed .modal-img-wrap {
      height: auto;
      max-height: none;
      margin: auto; /* centre inside scrollable area */
    }

    .modal-img {
      max-height: 100%;
      max-width: 100%;
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 24px 80px rgba(0,0,0,0.55);
      opacity: 0;
      transition: opacity 0.3s ease, transform 0.35s cubic-bezier(0.34,1.2,0.64,1);
      display: block;
      cursor: zoom-in;
    }
    .modal-img.loaded { opacity: 1; }
    .modal-stage.zoomed .modal-img {
      max-height: none;
      max-width: none;
      width: min(1800px, 260vh); /* large but sensible cap */
      cursor: zoom-out;
    }

    /* Subtle zoom hint that fades after first view */
    .zoom-hint {
      position: fixed;
      bottom: 3.2rem; right: 1.4rem;
      font-family: 'Cormorant Garamond', serif;
      font-size: 12px; font-style: italic;
      color: rgba(244,192,209,0.55);
      letter-spacing: 0.08em;
      pointer-events: none;
      transition: opacity 0.5s ease;
      z-index: 10;
    }
    .zoom-hint.hide { opacity: 0; }

    /* Nav arrows */
    .modal-arrow {
      position: fixed;
      top: 50%; transform: translateY(-50%);
      width: 48px; height: 48px;
      background: rgba(253,240,244,0.10);
      border: 1px solid rgba(244,192,209,0.30);
      border-radius: 50%;
      color: rgba(253,240,244,0.88);
      font-size: 18px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s, transform 0.15s;
      z-index: 10;
    }
    .modal-arrow:hover {
      background: rgba(253,240,244,0.22);
      transform: translateY(-50%) scale(1.1);
    }
    .modal-arrow.prev { left: 1.1rem; }
    .modal-arrow.next { right: 1.1rem; }
    .modal-arrow:disabled {
      opacity: 0.2; pointer-events: none;
    }

    /* Dot indicators */
    .modal-dots {
      position: fixed;
      bottom: 1.2rem; left: 50%; transform: translateX(-50%);
      display: flex; gap: 8px; align-items: center;
      z-index: 10;
    }
    .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: rgba(244,192,209,0.35);
      border: 1px solid rgba(244,192,209,0.5);
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
    }
    .dot.active {
      background: var(--rose-border);
      transform: scale(1.35);
    }
    .dot:hover { background: rgba(244,192,209,0.65); }

    /* ─── Responsive ─── */
    @media (max-width: 700px) {
      body { padding: 0.75rem; }
      .cal-frame { padding: 1.25rem 0.9rem 1.5rem; }
      .comic-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }
      .modal-stage { padding: 3.5rem 3.5rem; }
      .modal-arrow { width: 38px; height: 38px; font-size: 14px; }
      .modal-arrow.prev { left: 0.5rem; }
      .modal-arrow.next { right: 0.5rem; }
    }
    @media (max-width: 400px) {
      .comic-grid { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>

<div class="page-wrapper">
  <div class="cal-frame">

    <div class="cal-header">
      <div class="ornament-top">
        <div class="ornament-line"></div>
        <svg width="22" height="30" viewBox="0 0 22 30" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M11 2C9 5.5 5.5 6.5 5.5 10.5c0 3.1 2.5 5.5 5.5 5.5s5.5-2.4 5.5-5.5c0-4-3.5-5-5.5-8.5z" fill="#F4C0D1" stroke="#D4537E" stroke-width="0.8"/>
          <line x1="11" y1="16" x2="11" y2="29" stroke="#D4537E" stroke-width="0.8"/>
          <path d="M11 22 C9 20 6.5 20.5 6.5 20.5" stroke="#D4537E" stroke-width="0.8" stroke-linecap="round"/>
          <path d="M11 25 C13 23 15.5 23.5 15.5 23.5" stroke="#D4537E" stroke-width="0.8" stroke-linecap="round"/>
        </svg>
        <svg width="60" height="16" viewBox="0 0 60 16" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <line x1="0" y1="8" x2="22" y2="8" stroke="#F4C0D1" stroke-width="0.8"/>
          <circle cx="30" cy="8" r="4" fill="none" stroke="#D4537E" stroke-width="0.8"/>
          <circle cx="30" cy="8" r="1.5" fill="#D4537E"/>
          <line x1="38" y1="8" x2="60" y2="8" stroke="#F4C0D1" stroke-width="0.8"/>
        </svg>
        <svg width="22" height="30" viewBox="0 0 22 30" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="transform:scaleX(-1)">
          <path d="M11 2C9 5.5 5.5 6.5 5.5 10.5c0 3.1 2.5 5.5 5.5 5.5s5.5-2.4 5.5-5.5c0-4-3.5-5-5.5-8.5z" fill="#F4C0D1" stroke="#D4537E" stroke-width="0.8"/>
          <line x1="11" y1="16" x2="11" y2="29" stroke="#D4537E" stroke-width="0.8"/>
          <path d="M11 22 C9 20 6.5 20.5 6.5 20.5" stroke="#D4537E" stroke-width="0.8" stroke-linecap="round"/>
          <path d="M11 25 C13 23 15.5 23.5 15.5 23.5" stroke="#D4537E" stroke-width="0.8" stroke-linecap="round"/>
        </svg>
        <div class="ornament-line"></div>
      </div>
      <h1 class="cal-title">When Dee met Kate</h1>
      <p class="cal-subtitle">a story in four chapters</p>
      <div class="ornament-divider">
        <div class="divider-line"></div>
        <div class="divider-dot"></div>
        <div class="divider-diamond"></div>
        <div class="divider-dot"></div>
        <div class="divider-line"></div>
      </div>
    </div>

    <!-- Thumbnail grid -->
    <div class="comic-grid" id="comicGrid">

      <div class="comic-thumb" data-index="0">
        <img src="Page_1_15_24_30.png" alt="Chapter I — The Beginning" loading="lazy">
        <div class="thumb-label">Chapter I</div>
        <div class="thumb-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="#7B2D42" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="22" y2="22"/>
            <line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/>
          </svg>
        </div>
      </div>

      <div class="comic-thumb" data-index="1">
        <img src="Page_2_15_28_31.png" alt="Chapter II — The Return" loading="lazy">
        <div class="thumb-label">Chapter II</div>
        <div class="thumb-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="#7B2D42" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="22" y2="22"/>
            <line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/>
          </svg>
        </div>
      </div>

      <div class="comic-thumb" data-index="2">
        <img src="Page_3_15_33_44.png" alt="Chapter III — The Shift" loading="lazy">
        <div class="thumb-label">Chapter III</div>
        <div class="thumb-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="#7B2D42" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="22" y2="22"/>
            <line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/>
          </svg>
        </div>
      </div>

      <div class="comic-thumb" data-index="3">
        <img src="Page_4_15_45_02.png" alt="Chapter IV — The Message" loading="lazy">
        <div class="thumb-label">Chapter IV</div>
        <div class="thumb-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="#7B2D42" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="22" y2="22"/>
            <line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/>
          </svg>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- Modal lightbox -->
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="Comic viewer">

  <div class="modal-bar">
    <span class="modal-page-label" id="modalLabel">Chapter I of IV</span>
    <button class="modal-close" id="modalClose" aria-label="Close">✕</button>
  </div>

  <div class="modal-stage" id="modalStage">
    <div class="modal-img-wrap">
      <img class="modal-img" id="modalImg" src="" alt="">
    </div>
  </div>

  <span class="zoom-hint" id="zoomHint">click image to zoom</span>

  <button class="modal-arrow prev" id="prevBtn" aria-label="Previous page">&#8592;</button>
  <button class="modal-arrow next" id="nextBtn" aria-label="Next page">&#8594;</button>

  <div class="modal-dots" id="modalDots">
    <div class="dot active" data-i="0"></div>
    <div class="dot" data-i="1"></div>
    <div class="dot" data-i="2"></div>
    <div class="dot" data-i="3"></div>
  </div>

</div>

<script>
  const pages = [
    { src: 'Page_1_15_24_30.png',  label: 'Chapter I of IV'   },
    { src: 'Page_2_15_28_31.png',  label: 'Chapter II of IV'  },
    { src: 'Page_3_15_33_44.png',  label: 'Chapter III of IV' },
    { src: 'Page_4_15_45_02.png',  label: 'Chapter IV of IV'  },
  ];

  const modal      = document.getElementById('modal');
  const modalStage = document.getElementById('modalStage');
  const modalImg   = document.getElementById('modalImg');
  const modalLabel = document.getElementById('modalLabel');
  const modalClose = document.getElementById('modalClose');
  const prevBtn    = document.getElementById('prevBtn');
  const nextBtn    = document.getElementById('nextBtn');
  const zoomHint   = document.getElementById('zoomHint');
  const dots       = document.querySelectorAll('.dot');
  let current = 0;
  let zoomed  = false;
  let hintShown = false;

  /* ── Zoom toggle ── */
  function setZoom(on) {
    zoomed = on;
    modalStage.classList.toggle('zoomed', zoomed);
    if (!zoomed) {
      // Scroll back to top-left when zooming out
      modalStage.scrollTo({ top: 0, left: 0, behavior: 'smooth' });
    }
  }

  modalImg.addEventListener('click', e => {
    e.stopPropagation(); // don't bubble to modal backdrop
    setZoom(!zoomed);
  });

  function goTo(index) {
    setZoom(false);
    current = index;
    const page = pages[current];
    modalImg.classList.remove('loaded');
    modalImg.src = page.src;
    modalImg.alt = page.label;
    modalLabel.textContent = page.label;
    modalImg.onload = () => modalImg.classList.add('loaded');
    if (modalImg.complete) modalImg.classList.add('loaded');
    prevBtn.disabled = current === 0;
    nextBtn.disabled = current === pages.length - 1;
    dots.forEach((d, i) => d.classList.toggle('active', i === current));
  }

  function openModal(index) {
    goTo(index);
    modal.classList.add('visible');
    document.body.style.overflow = 'hidden';
    // Show zoom hint once, then fade it out
    if (!hintShown) {
      hintShown = true;
      zoomHint.classList.remove('hide');
      setTimeout(() => zoomHint.classList.add('hide'), 2800);
    }
  }

  function closeModal() {
    setZoom(false);
    modal.classList.remove('visible');
    document.body.style.overflow = '';
  }

  // Thumbnail clicks
  document.querySelectorAll('.comic-thumb').forEach(thumb => {
    thumb.addEventListener('click', () => openModal(+thumb.dataset.index));
  });

  // Navigation — guard against firing while zoomed (user may be scrolling)
  prevBtn.addEventListener('click', e => { e.stopPropagation(); if (current > 0) goTo(current - 1); });
  nextBtn.addEventListener('click', e => { e.stopPropagation(); if (current < pages.length - 1) goTo(current + 1); });
  dots.forEach(d => d.addEventListener('click', e => { e.stopPropagation(); goTo(+d.dataset.i); }));

  // Close — only when clicking the dark backdrop, not the scrollable stage
  modalClose.addEventListener('click', closeModal);
  modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });

  // Keyboard
  document.addEventListener('keydown', e => {
    if (!modal.classList.contains('visible')) return;
    if (e.key === 'Escape') { if (zoomed) setZoom(false); else closeModal(); return; }
    if (zoomed) return; // don't page-flip while zoomed in
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
      if (current < pages.length - 1) goTo(current + 1);
    } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
      if (current > 0) goTo(current - 1);
    }
  });

  // Touch swipe — only when not zoomed
  let touchStartX = 0;
  modal.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, { passive: true });
  modal.addEventListener('touchend', e => {
    if (zoomed) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    if (Math.abs(dx) < 40) return;
    if (dx < 0 && current < pages.length - 1) goTo(current + 1);
    if (dx > 0 && current > 0) goTo(current - 1);
  }, { passive: true });
</script>

</body>
</html>
