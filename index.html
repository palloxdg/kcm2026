<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#13281f">
  <meta name="description" content="KCM2026 — Kate's November birthday adventure">
  <title>KCM2026 · Kate's November Adventure</title>
  <link rel="stylesheet" href="./css/styles.css?v=desktop-map-progress-1">
</head>
<body>
  <div class="app-shell">
<main id="game" class="game">
      <section id="mapView" class="view map-view is-active" aria-labelledby="mapTitle">
        <div class="map-copy">
          <p class="eyebrow">The journey begins</p>
          <div class="journey-status" aria-live="polite">
            <span id="dayLabel">November 1</span>
            <span class="status-divider" aria-hidden="true"></span>
            <span><strong id="completedCount">0</strong> / 30 quests complete</span>
            <span class="status-divider" aria-hidden="true"></span>
            <span id="currentRegion">Awaiting November</span>
            <span class="status-divider" aria-hidden="true"></span>
            <button id="openJournal" class="journal-button" type="button" aria-label="Open journey journal" title="Journey journal">
              <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M4 6.5c4.9-.8 8.8.2 12 3v17c-3.2-2.8-7.1-3.8-12-3V6.5Zm24 0c-4.9-.8-8.8.2-12 3v17c3.2-2.8 7.1-3.8 12-3V6.5Z"/><path d="M16 9.5v17"/></svg>
            </button>
            <span class="status-divider status-divider-after-journal" aria-hidden="true"></span>
            <button id="resetProgress" class="reset-progress" type="button">Reset test progress</button>
          </div>
          <h1 id="mapTitle">A world is waiting, Kate.</h1>
          <p id="mapHint">Thirty landmarks. Thirty discoveries. Follow the golden marker.</p>
        </div>

        <div class="map-scroll">
          <span class="map-scroll-roll map-scroll-roll-left" aria-hidden="true"></span>
          <span class="map-scroll-roll map-scroll-roll-right" aria-hidden="true"></span>
          <div id="mapViewport" class="map-viewport">
          <div id="mapWorld" class="map-world">
            <img class="map-art" src="./assets/art/world-map-painted.webp" alt="Hand-painted fantasy adventure map with villages, forests, rivers, mountains and coastal islands">
            <div id="questMarkers" class="quest-markers"></div>
          </div>
          <div class="map-vignette" aria-hidden="true"></div>
          <div class="map-compass" aria-hidden="true"><span>N</span></div>
          <div class="map-legend" aria-label="Quest marker legend">
            <span><i class="legend-dot is-active"></i>Today</span>
            <span><i class="legend-dot is-available"></i>Available</span>
            <span><i class="legend-dot is-complete"></i>Complete</span>
          </div>
        </div>

        </div>

        <div class="progress-panel">
          <div class="progress-label"><span>World discovered</span><strong id="discoveryPercent">3%</strong></div>
          <div class="progress-track"><span id="discoveryBar"></span></div>
        </div>
      </section>

      <section id="sceneView" class="view scene-view" aria-labelledby="sceneTitle" aria-hidden="true">
        <div class="scene-stage" id="sceneStage">
          <img id="sceneArt" class="scene-art" src="" alt="">
          <img id="sceneOpenArt" class="scene-art scene-open-art" src="" alt="" aria-hidden="true">
          <button id="hotspot" class="hotspot" type="button">
            <span class="hotspot-pulse" aria-hidden="true"></span>
            <span class="hotspot-label">Inspect</span>
          </button>
          <div class="scene-shade" aria-hidden="true"></div>
          <div class="scene-copy">
            <button id="backButton" class="back-button" type="button">← World map</button>
            <p id="sceneRegion" class="eyebrow"></p>
            <h2 id="sceneTitle"></h2>
            <p id="scenePrompt"></p>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div id="letterOverlay" class="letter-overlay" role="dialog" aria-modal="true" aria-label="Kate's letter" aria-hidden="true">
    <div class="letter-backdrop" aria-hidden="true"></div>
    <div class="letter-sheet">
      <img id="letterImage" src="" alt="A personal letter for Kate">
      <button id="closeLetter" class="letter-close" type="button" aria-label="Close letter">×</button>
    </div>
  </div>
  <div id="rewardModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="rewardTitle" aria-hidden="true">
    <div class="modal-backdrop"></div>
    <div class="reward-card">
      <button id="closeReward" class="modal-close" type="button" aria-label="Close reward">×</button>
      <div class="reward-ribbon">Quest complete</div>
      <div id="rewardIcon" class="reward-icon" aria-hidden="true">✦</div>
      <p id="rewardDay" class="eyebrow"></p>
      <h2 id="rewardTitle"></h2>
      <p id="rewardText"></p>
      <button id="rewardVoucher" class="voucher" type="button">
        <img id="rewardVoucherImage" src="" alt="">
        <span class="visually-hidden">View voucher code</span>
      </button>
      <button id="returnButton" class="primary-button" type="button">Return to the map</button>
    </div>
  </div>

  <div id="journalOverlay" class="journal-overlay" role="dialog" aria-modal="true" aria-labelledby="journalTitle" aria-hidden="true"><div class="journal-backdrop" data-close-journal aria-hidden="true"></div><section class="journal-book"><button id="closeJournal" class="journal-close" type="button" aria-label="Close journal">×</button><header class="journal-heading"><p class="journal-kicker">Kate's journey</p><h2 id="journalTitle">The Adventure Journal</h2><p id="journalPageLabel" class="journal-page-label"></p></header><div class="journal-nav" aria-label="Journal pages"><button id="journalPrevious" type="button" aria-label="Previous journal page">←</button><button id="journalNext" type="button" aria-label="Next journal page">→</button></div><div id="journalPage" class="journal-page"></div><span class="journal-binding" aria-hidden="true"></span></section></div>
  <div id="parchmentOverlay" class="journal-detail-overlay" role="dialog" aria-modal="true" aria-labelledby="parchmentTitle" aria-hidden="true"><div class="journal-detail-backdrop" data-close-parchment aria-hidden="true"></div><section class="voucher-parchment"><button id="closeParchment" class="journal-detail-close" type="button" aria-label="Close voucher details">×</button><p class="journal-kicker">Voucher collection</p><h2 id="parchmentTitle"></h2><div id="parchmentCodes" class="parchment-codes"></div></section></div>
  <div id="imageOverlay" class="journal-detail-overlay image-viewer" role="dialog" aria-modal="true" aria-labelledby="imageViewerTitle" aria-hidden="true"><div class="journal-detail-backdrop" data-close-image aria-hidden="true"></div><figure class="image-viewer-frame"><button id="closeImageViewer" class="journal-detail-close" type="button" aria-label="Close image">×</button><button id="previousJournalImage" class="image-viewer-nav image-viewer-previous" type="button" aria-label="Previous completed image">←</button><img id="journalFullImage" src="" alt=""><button id="nextJournalImage" class="image-viewer-nav image-viewer-next" type="button" aria-label="Next completed image">→</button><figcaption id="imageViewerTitle"></figcaption></figure></div>

  <template id="markerTemplate">
    <button class="quest-marker" type="button">
      <span class="marker-pin"><span class="marker-symbol">!</span></span>
      <span class="marker-label"></span>
    </button>
  </template>

  <script defer src="./js/app.bundle.js?v=internal-vouchers-1"></script>
</body>
</html>
